params:
  seed: 42
  algo:
    name: imitation_continuous

  model:
    name: continuous_a2c_logstd

  # Student network configuration
  network:
  
    name: rnntestnet
    separate: False
    obs_shape: 45
    scenario: 5 
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [256, 128, 64]  # Student: smaller network
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  # Teacher network configuration (different architecture)
  teacher_network:
    name: dectestnet  # or could be different like 'rnntestnet'
    separate: False
    obs_shape: 19 #1 #45 #13
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [512, 256, 128]  # Teacher: larger network
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  config:
    env_name: position_setpoint_task_custom
    env_config:
      num_envs: 1024 #2048

    name: ImitationLearning
    reward_shaper:
      # min_val: -1
      scale_value: 0.1
    multi_gpu: False
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    num_actors: 2048
    learning_rate: 3e-4
    max_epochs: 1000
    save_best_after: 100
    save_frequency: 25
    print_stats: False
    score_to_win: 5000000
    
    # Imitation learning specific parameters
    batch_size: 256 
    demonstration_buffer_size: 100000
    num_warmup_steps: 1
    num_warmup_steps_dagger: 100
    horizon_length: 32 
    teacher_checkpoint: "./runs/8rnn_12-17-43-44/nn/8rnn.pth"
    # Enable different architectures
    use_different_teacher_arch: True